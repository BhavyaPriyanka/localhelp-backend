apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: localhelp
  labels:
    app: backend
    purpose: deployment
    tier: backend-app
    project: localhelp

spec:
  replicas: {{ .Values.deployment.replicas }}

  selector:
    matchLabels:
      app: backend
      purpose: deployment
      tier: backend-app
      project: localhelp

  template:
    metadata:
      labels:
        app: backend
        purpose: deployment
        tier: backend-app
        project: localhelp

    spec:
      nodeSelector:
        workload: backend

      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for AWS RDS..."

              until nc -z db-dev.localhelp.store 3306; do
                echo "MySQL is not ready yet..."
                sleep 2
              done

              echo "RDS is reachable!"

      containers:
        - name: backend

          image: {{ .Values.deployment.image }}:{{ .Values.deployment.imageVersion }}

          envFrom:
            - configMapRef:
                name: backend

            - secretRef:
                name: backend-db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "150m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3